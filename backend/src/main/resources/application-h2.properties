spring.application.name=jobportal

# Server Config
server.port=8080

# H2 In-Memory Database Configuration (Zero-Setup Instant Run)
spring.datasource.url=jdbc:h2:mem:job_portal_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom File Upload Directory
app.upload.dir=uploads

# JWT Security Secrets
app.jwt.secret=9a2f8c4e1b7d3a6f9c8e5b2a4f7d1e3c8b5a2f9e4c7b1a3f6d9e2c5b8a1f4e7d
app.jwt.expiration-ms=86400000

# SQL Initialization
spring.sql.init.mode=always
